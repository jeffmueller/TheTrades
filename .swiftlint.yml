# Deliberately close to SwiftLint's defaults. The point is to keep
# contributions stylistically consistent, not to relitigate the existing code.

included:
  - TheTrades
  - TheTradesTests

excluded:
  - .build
  - .derived-data
  - .spm-cache
  - build

analyzer_rules:
  - unused_import

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# SwiftUI view bodies are legitimately long and deeply nested; measuring them
# against rules written for imperative code produces noise, not insight.
type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 120
  error: 200

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

disabled_rules:
  # The codebase uses trailing commas in multi-line collection literals
  # consistently, and Swift permits them. Nothing to gain from churning it.
  - trailing_comma

# Short bindings are idiomatic here -- `a`/`b` in a `sorted { }` closure,
# and single letters in exhaustive `switch` case bindings. The rule's other
# checks (casing, forbidden names) still apply.
identifier_name:
  min_length:
    warning: 1
    error: 1
