name: TheTrades
options:
  # No bundleIdPrefix: PRODUCT_BUNDLE_IDENTIFIER comes from Config/*.xcconfig
  # for both targets. XcodeGen's auto-generated value would be written into the
  # target's build settings, where it would shadow the xcconfig.
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.8.0"
targets:
  TheTrades:
    type: application
    platform: iOS
    sources:
      - path: TheTrades
    dependencies:
      - package: Nuke
        product: NukeUI
    # Signing, the bundle ID, and the TMDB token live in an xcconfig so a fork
    # needs no edits to tracked files. Do not move these into `settings.base`
    # below: target build settings override a base configuration file.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    scheme:
      testTargets:
        - TheTradesTests
    # An explicit Info.plist rather than GENERATE_INFOPLIST_FILE, because the
    # TMDB token has to reach the bundle and Xcode's INFOPLIST_KEY_* prefix
    # only honours Apple's own known keys -- an arbitrary
    # INFOPLIST_KEY_TMDBBearerToken is silently dropped. XcodeGen regenerates
    # this file from the properties below, so it is gitignored.
    info:
      path: TheTrades/Info.plist
      properties:
        CFBundleDisplayName: TheTrades
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        # RootView adapts to size class (including a narrow iPad Split View
        # slot), so the app opts into multitasking, which requires all four
        # iPad orientations to be declared.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # HTTPS-only, no custom crypto: exempt from export compliance. Declaring
        # it here skips the per-build question in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Populated from the TMDB_BEARER_TOKEN build setting, which
        # Config/App.xcconfig reads from the gitignored Config/Local.xcconfig.
        # Empty when no token is configured; the app then surfaces
        # TMDBError.missingAPIToken instead of failing to build.
        TMDBBearerToken: $(TMDB_BEARER_TOKEN)
    settings:
      base:
        # Bump CURRENT_PROJECT_VERSION for every TestFlight upload; App Store
        # Connect rejects a build number it has already seen for this version.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TheTradesTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    sources:
      - TheTradesTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TheTrades
